<?xml version="1.0" encoding="UTF-8"?>
<!-- Sakina app icon master (1024×1024). Emerald field, gold 8-point star, crescent. No text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#17866F"/>
      <stop offset="55%" stop-color="#0E5E4E"/>
      <stop offset="100%" stop-color="#083F34"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C878"/>
      <stop offset="50%" stop-color="#C9A24D"/>
      <stop offset="100%" stop-color="#A9822F"/>
    </linearGradient>
    <pattern id="girih" width="128" height="128" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A24D" stroke-width="2" opacity="0.10">
        <rect x="34" y="34" width="60" height="60"/>
        <rect x="34" y="34" width="60" height="60" transform="rotate(45 64 64)"/>
        <path d="M0 0 L34 34 M128 0 L94 34 M0 128 L34 94 M128 128 L94 94"/>
      </g>
    </pattern>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="500" cy="512" r="150" fill="#fff"/>
      <circle cx="560" cy="482" r="128" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#girih)"/>
  <!-- 8-point star: two overlapping squares -->
  <g transform="translate(512 512)">
    <g fill="#0B4D40" stroke="url(#gold)" stroke-width="22" stroke-linejoin="round">
      <rect x="-250" y="-250" width="500" height="500" rx="18"/>
      <rect x="-250" y="-250" width="500" height="500" rx="18" transform="rotate(45)"/>
    </g>
    <g fill="#0B4D40">
      <rect x="-239" y="-239" width="478" height="478" rx="12"/>
      <rect x="-239" y="-239" width="478" height="478" rx="12" transform="rotate(45)"/>
    </g>
    <circle r="214" fill="none" stroke="#C9A24D" stroke-width="4" opacity="0.55"/>
  </g>
  <rect width="1024" height="1024" fill="url(#gold)" mask="url(#crescent)"/>
  <!-- small star inside the crescent opening -->
  <g transform="translate(606 472)" fill="url(#gold)">
    <rect x="-26" y="-26" width="52" height="52"/>
    <rect x="-26" y="-26" width="52" height="52" transform="rotate(45)"/>
  </g>
</svg>
